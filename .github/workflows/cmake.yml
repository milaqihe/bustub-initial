name: Project 1

on:
  push:
    branches: [main, 'team/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1:
    name: P1 Clang 14 ASan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-14 clang-format-14 clang-tidy-14 python3 python3-pip pkg-config zlib1g-dev zip

      - name: Install consistent CMake
        run: |
          python3 -m pip install --user "cmake==3.31.10"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DBUSTUB_SANITIZER=address
          -DCMAKE_C_COMPILER=clang-14 -DCMAKE_CXX_COMPILER=clang++-14
          -DCLANG_FORMAT_BIN=clang-format-14 -DCLANG_TIDY_BIN=clang-tidy-14

      - name: Build P1 tests
        id: build
        run: cmake --build build --target build-p1-tests -j 4

      - name: Run P1 tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error -L '^p1$'

      - name: Check P1 format and lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target check-p1-format check-p1-lint

      - name: Check P1 clang-tidy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target check-clang-tidy-p1

      - name: Package successful P1 build
        if: ${{ success() }}
        run: cmake --build build --target submit-p1

      - name: Preserve test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: p1-test-diagnostics
          path: |
            build/Testing/Temporary/LastTest.log
            build/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve successful submission package
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: project1-submission
          path: project1-submission.zip
          if-no-files-found: error
          retention-days: 7
